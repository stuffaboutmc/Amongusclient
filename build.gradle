buildscript {
    repositories {
        mavenCentral()
        maven { url "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0-Premium'
group = 'com.amongus'
archivesBaseName = 'among-us-client'

sourceCompatibility = targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

// Custom configuration for dependencies we want to bundle
configurations {
    modCompile
}

repositories {
    mavenCentral()
}

dependencies {
    // Forge client – needed for compilation, but not bundled in the jar
    compile 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9:universal'

    // Dependencies to bundle (JNA + ASM)
    modCompile 'net.java.dev.jna:jna:5.13.0'
    modCompile 'net.java.dev.jna:jna-platform:5.13.0'
    modCompile 'org.ow2.asm:asm:9.5'
    modCompile 'org.ow2.asm:asm-commons:9.5'
}

jar {
    // Include your own compiled classes and resources
    from sourceSets.main.output

    // Include only .class files from the dependencies we want to bundle
    from {
        configurations.modCompile.collect { zipTree(it).matching { include '**/*.class' } }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Premain-Class': 'com.amongus.client.injector.AgentMain',
                   'Agent-Class': 'com.amongus.client.injector.AgentMain',
                   'Can-Retransform-Classes': 'true',
                   'Can-Redefine-Classes': 'true',
                   'Implementation-Title': 'among us client Premium'
    }
}
