buildscript {
    repositories {
        mavenCentral()
        maven { url "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0-Premium'
group = 'com.amongus'
archivesBaseName = 'among-us-client'

sourceCompatibility = targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

repositories {
    mavenCentral()
}

dependencies {
    // Explicitly add Forge client to compile classpath so ClientChatEvent is found
    compile 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9:universal'
    compile 'net.java.dev.jna:jna:5.13.0'
    compile 'net.java.dev.jna:jna-platform:5.13.0'
    compile 'org.ow2.asm:asm:9.5'
    compile 'org.ow2.asm:asm-commons:9.5'
}

// ---- Slim jar with only your class files (no resources, no deps) ----
task slimJar(type: Jar) {
    from sourceSets.main.output
    include 'com/amongus/**/*.class'
    archiveName = 'slim.jar'
    destinationDir = file('build/libs')
}

// ---- Reobfuscate the slim jar ----
reobf {
    jar {
        // Use the slim jar as the input for reobf
        file = slimJar.archivePath
    }
}

// ---- Full jar: obfuscated classes + resources + dependency .class files ----
task finalJar(type: Jar) {
    baseName = 'among-us-client'
    version = '1.0-Premium'

    // Include the reobfuscated classes
    from zipTree(reobfJar.getOutputs().getFiles().getSingleFile())

    // Include your resources (config.json, fonts, mcmod.info)
    from sourceSets.main.resources

    // Include only the .class files from dependencies (no META-INF, no signatures)
    from {
        configurations.compile.collect { zipTree(it).matching { include '**/*.class' } }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Premain-Class': 'com.amongus.client.injector.AgentMain',
                   'Agent-Class': 'com.amongus.client.injector.AgentMain',
                   'Can-Retransform-Classes': 'true',
                   'Can-Redefine-Classes': 'true',
                   'Implementation-Title': 'among us client Premium'
    }

    dependsOn reobfJar
    archiveName = archivesBaseName + '-' + version + '.jar'
}

// Disable the default jar task to avoid conflicts
jar.enabled = false

// Make the final jar the default build output
build.dependsOn finalJar
