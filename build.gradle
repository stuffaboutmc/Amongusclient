buildscript {
    repositories {
        mavenCentral()
        maven { url "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0-Premium'
group = 'com.amongus'
archivesBaseName = 'among-us-client'

sourceCompatibility = targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

// Configuration for dependencies to bundle (JNA + ASM)
configurations {
    bundled
    compile.extendsFrom bundled
}

repositories {
    mavenCentral()
}

dependencies {
    // Forge client – needed for compilation (ClientChatEvent)
    // Not bundled into the mod jar.
    compile 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9:universal'

    // Dependencies to bundle – only .class files will be included
    bundled 'net.java.dev.jna:jna:5.13.0'
    bundled 'net.java.dev.jna:jna-platform:5.13.0'
    bundled 'org.ow2.asm:asm:9.5'
    bundled 'org.ow2.asm:asm-commons:9.5'
}

jar {
    from sourceSets.main.output
    from {
        configurations.bundled.collect { zipTree(it).matching { include '**/*.class' } }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Premain-Class': 'com.amongus.client.injector.AgentMain',
                   'Agent-Class': 'com.amongus.client.injector.AgentMain',
                   'Can-Retransform-Classes': 'true',
                   'Can-Redefine-Classes': 'true',
                   'Implementation-Title': 'among us client Premium'
    }
}
