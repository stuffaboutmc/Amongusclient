buildscript {
    repositories {
        mavenCentral()
        maven { url "https://files.minecraftforge.net/maven" }
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'com.github.jengelman.gradle.plugins:shadow:5.2.0'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'com.github.johnrengelman.shadow'

version = '1.0-Premium'
group = 'com.amongus'
archivesBaseName = 'among-us-client'

sourceCompatibility = targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

repositories {
    mavenCentral()
}

dependencies {
    compile 'net.java.dev.jna:jna:5.13.0'
    compile 'net.java.dev.jna:jna-platform:5.13.0'
    compile 'org.ow2.asm:asm:9.5'
    compile 'org.ow2.asm:asm-commons:9.5'
}

shadowJar {
    classifier = null   // removes "-all" suffix, outputs directly
    // Exclude duplicate files that break reobfJar
    exclude 'dummyThing'
    exclude 'META-INF/AL2.0'
    exclude 'META-INF/LGPL2.1'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE'
    exclude 'META-INF/NOTICE'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/**'
    manifest {
        attributes 'Premain-Class': 'com.amongus.client.injector.AgentMain',
                   'Agent-Class': 'com.amongus.client.injector.AgentMain',
                   'Can-Retransform-Classes': 'true',
                   'Can-Redefine-Classes': 'true',
                   'Implementation-Title': 'among us client Premium'
    }
}

// Reobfuscate the shadow jar instead of the default jar
reobf {
    shadowJar {
        // uses default mapping type 'SEARGE'
    }
}

// Make the default build task produce the reobfuscated shadow jar
tasks.build.dependsOn reobfShadowJar
